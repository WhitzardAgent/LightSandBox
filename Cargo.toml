[workspace]
resolver = "2"
members = [
    "crates/ls-core",
    "crates/ls-host",
    "crates/ls-api",
    "crates/ls-guest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ls-core = { path = "crates/ls-core" }
