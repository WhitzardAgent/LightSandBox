[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "lightsandbox-client-reference"
version = "0.5.0.dev0"
description = "LightSandbox v1 HTTP/CLI contract reference; sandbox daemon not included"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]
[project.scripts]
lsbx = "lightsandbox.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
