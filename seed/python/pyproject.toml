[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightsandbox-development-seeds"
version = "0.3.0.dev0"
description = "Development reference code; not a functioning sandbox runtime"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lightsandbox-seed = "lightsandbox_seed.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
